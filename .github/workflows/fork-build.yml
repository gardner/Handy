name: "Fork Build"

# Unsigned builds for gardner/Handy. No secrets needed: upstream's signing
# accounts (Azure Trusted Signing, Apple, the updater key) belong to the
# upstream maintainer. src-tauri/tauri.fork.conf.json switches those off for
# this build only, so tauri.conf.json stays identical to upstream:
#   - Windows: no signCommand (unsigned; SmartScreen asks once per download)
#   - macOS: ad-hoc signed (tauri.conf.json's signingIdentity "-"), not notarized.
#     Built in its own job: build.yml always sets APPLE_CERTIFICATE (empty when
#     unsigned), and Tauri then tries to import that empty certificate and fails.
#   - Linux: built on Ubuntu 24.04 only. ONNX Runtime's prebuilt library (used by
#     Read Aloud) needs glibc 2.38+, so it can't link on 22.04.
#   - no updater artifacts, and the updater looks at this fork's releases
#     instead of upstream's, so it never "updates" to a build without our changes
# Installers are attached to each run as artifacts for 30 days.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'gardner/Handy'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: "--config src-tauri/tauri.fork.conf.json"
            target: "x86_64-pc-windows-msvc"
          - platform: "ubuntu-24.04"
            args: "--bundles appimage,deb,rpm --config src-tauri/tauri.fork.conf.json"
            target: "x86_64-unknown-linux-gnu"

    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      build-args: ${{ matrix.args }}
      asset-prefix: "handy-fork"
      upload-artifacts: true
      sign-binaries: false

  macos:
    if: github.repository == 'gardner/Handy'
    runs-on: macos-26
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: fork-macos-aarch64
          cache-bin: false
      - run: bun install
      - name: Build (ad-hoc signed)
        run: bun tauri build --target "$TARGET" --config src-tauri/tauri.fork.conf.json
      - name: Check the app is ad-hoc signed
        run: codesign --verify --deep --strict --verbose=2 src-tauri/target/$TARGET/release/bundle/macos/Handy.app
      - uses: actions/upload-artifact@v7
        with:
          name: handy-fork-aarch64-apple-darwin
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30

  # Publishes every successful build of main as a GitHub Release, so the
  # installers have permanent public links (run artifacts expire and need a
  # GitHub login). Tagged v<version>-fork.<run>, since the app version follows
  # upstream; the newest is marked Latest, so /releases/latest always works.
  release:
    if: github.repository == 'gardner/Handy' && github.ref == 'refs/heads/main'
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: handy-fork-*
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
          tag="v${version}-fork.${{ github.run_number }}"
          mapfile -t files < <(find artifacts -type f \( -name '*.exe' -o -name '*.msi' \
            -o -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) | sort)
          printf 'Uploading:\n'; printf '  %s\n' "${files[@]}"
          [ "${#files[@]}" -ge 6 ] || { echo "expected 6 installers"; exit 1; }
          cat > notes.md <<NOTES
          Handy with **Read Aloud**: select text in any app and press **Ctrl+Alt+R** (Windows/Linux) or **Option+Shift+R** (macOS) to hear it. Press again to stop.

          **macOS Accessibility is optional during setup.** Without it, global shortcuts (including Read Aloud), automatic pasting and auto-submit are disabled. Dictation results are copied to the clipboard; file transcription and the Read Aloud voice preview remain available. Grant Accessibility later to re-enable the disabled controls without losing saved preferences.

          Built from ${GITHUB_SHA:0:8}. These builds aren't code-signed, so the first launch needs one extra step:

          | | Download | First launch |
          |---|---|---|
          | **Windows** | \`Handy_${version}_x64-setup.exe\` | SmartScreen says "Windows protected your PC": click **More info → Run anyway**. |
          | **macOS** (Apple Silicon) | \`Handy_${version}_aarch64.dmg\` | Open it once, then **System Settings → Privacy & Security → Open Anyway**. If it says "damaged", run \`xattr -dr com.apple.quarantine /Applications/Handy.app\`. |
          | **Linux** | \`.AppImage\`, \`.deb\` or \`.rpm\` | Needs Ubuntu 24.04 / Debian 13 or newer (glibc 2.38+). Make the AppImage executable first. |
          NOTES
          gh release create "$tag" "${files[@]}" \
            --target "$GITHUB_SHA" \
            --title "Handy ${version} (fork build ${{ github.run_number }})" \
            --notes-file notes.md \
            --generate-notes \
            --latest
